name: Anu TUNNEL Build from Uploaded ZIP

on:
  workflow_dispatch:
  push:
    branches: [ main, 'engine/**' ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded project
        shell: bash
        run: |
          set -Eeuo pipefail
          ZIP="Anu_TUNNEL_v1.4.0_build.zip"
          test -s "$ZIP"
          unzip -q "$ZIP" -d "$GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/anu_tunnel/app/build.gradle"

      - name: Export source for review
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p review-source
          cp -a anu_tunnel/app/src/main/java review-source/
          cp -a anu_tunnel/app/src/main/AndroidManifest.xml review-source/ 2>/dev/null || true
          cp -a anu_tunnel/app/build.gradle review-source/
          cp -a anu_tunnel/tools review-source/ 2>/dev/null || true
          zip -qr review-source.zip review-source
      - name: Upload review source
        uses: actions/upload-artifact@v4
        with:
          name: Anu-TUNNEL-review-source
          path: review-source.zip
          retention-days: 7

      - name: Verify v1.4.0 source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 anu_tunnel/tools/verify_source.py
          echo "Verified uploaded Anu TUNNEL v1.4.0 source"

      - name: Apply Anu TUNNEL v1.5.0 UI and navigation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 ci/apply_ui_v1_5.py
          grep -q 'private fun openHomeMenu' anu_tunnel/app/src/main/java/com/anutunnel/app/MainActivity.kt
          grep -q "versionName '1.5.0'" anu_tunnel/app/build.gradle
          mkdir -p patched-source
          cp -a anu_tunnel/app/src/main/java patched-source/
          cp -a anu_tunnel/app/src/main/AndroidManifest.xml patched-source/ 2>/dev/null || true
          cp -a anu_tunnel/app/build.gradle patched-source/
          zip -qr Anu-TUNNEL-v1.5.0-source.zip patched-source
      - name: Upload patched v1.5.0 source
        uses: actions/upload-artifact@v4
        with:
          name: Anu-TUNNEL-v1.5.0-source
          path: Anu-TUNNEL-v1.5.0-source.zip
          retention-days: 14
      - name: Extract and apply Anu TUNNEL v1.6.0 BadVPN engine integration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64, gzip, io, tarfile
          from pathlib import Path
          encoded = Path("ci/v1.6-engine-sources.tar.gz.b64").read_text().strip()
          required = {"ci/apply_engine_v1_6.py", "ci/prepare_badvpn.py", "ci/build_badvpn_android.sh", "ci/BADVPN-COPYING.txt"}
          candidates = [encoded]
          # Recover a single accidental extra Base64 character only when the candidate
          # decompresses and contains the exact four expected, safe tar entries.
          if len(encoded) % 4:
              candidates = (encoded[:i] + encoded[i+1:] for i in range(len(encoded)))
          recovered = None
          for candidate in candidates:
              try:
                  compressed = base64.b64decode(candidate, validate=True)
                  archive = gzip.decompress(compressed)
                  with tarfile.open(fileobj=io.BytesIO(archive), mode="r:") as tf:
                      names = {m.name for m in tf.getmembers() if m.isfile()}
                      if not required.issubset(names):
                          continue
                      if any(m.name.startswith("/") or ".." in Path(m.name).parts for m in tf.getmembers()):
                          continue
                      recovered = archive
                      break
              except Exception:
                  continue
          if recovered is None:
              raise SystemExit("v1.6 engine source archive failed Base64/gzip/tar integrity checks")
          with tarfile.open(fileobj=io.BytesIO(recovered), mode="r:") as tf:
              tf.extractall(path=".", members=[m for m in tf.getmembers() if m.name in required])
          print("Validated and extracted the four v1.6 engine integration sources")
          PY
          python3 ci/apply_engine_v1_6.py anu_tunnel
          python3 anu_tunnel/tools/verify_source.py
          grep -q "versionName '1.6.0'" anu_tunnel/app/build.gradle
          mkdir -p patched-source-v1.6.0
          cp -a anu_tunnel/app/src/main/java patched-source-v1.6.0/
          cp -a anu_tunnel/app/src/main/assets patched-source-v1.6.0/
          cp -a anu_tunnel/app/src/main/AndroidManifest.xml patched-source-v1.6.0/
          cp -a anu_tunnel/app/build.gradle patched-source-v1.6.0/
          cp -a anu_tunnel/tools patched-source-v1.6.0/
          cp anu_tunnel/README.md anu_tunnel/BUILD_STATUS.md anu_tunnel/THIRD_PARTY_NOTICES.md patched-source-v1.6.0/
          zip -qr Anu-TUNNEL-v1.6.0-source.zip patched-source-v1.6.0
      - name: Upload patched v1.6.0 source
        uses: actions/upload-artifact@v4
        with:
          name: Anu-TUNNEL-v1.6.0-source
          path: Anu-TUNNEL-v1.6.0-source.zip
          retention-days: 14

      - name: Align Java and Kotlin JVM targets
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("anu_tunnel/app/build.gradle")
          s = p.read_text()
          if "sourceCompatibility JavaVersion.VERSION_17" not in s:
              needle = "android {"
              if needle not in s:
                  raise SystemExit("android block not found in app/build.gradle")
              block = """android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          """
              s = s.replace(needle, block, 1)
              p.write_text(s)
          print("Java/Kotlin JVM targets aligned to 17")
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.4'
          cache: false

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install pinned gomobile and gobind
        shell: bash
        run: |
          set -Eeuo pipefail
          export GOTOOLCHAIN=local
          export GOMAXPROCS=2
          MOBILE_VERSION='v0.0.0-20260112195712-5b9ecdfb8721'
          go install "golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION"
          MODULE_DIR="$(go env GOPATH)/pkg/mod/golang.org/x/mobile@$MOBILE_VERSION"
          PATCH_DIR="$RUNNER_TEMP/mobile-patched"
          test -f "$MODULE_DIR/cmd/gomobile/init.go"
          mkdir -p "$PATCH_DIR"
          cp -a "$MODULE_DIR/." "$PATCH_DIR/"
          chmod -R u+rwX "$PATCH_DIR"
          sed -i "s|golang.org/x/mobile/cmd/gobind@latest|golang.org/x/mobile/cmd/gobind@$MOBILE_VERSION|g" "$PATCH_DIR/cmd/gomobile/init.go"
          ! grep -q 'gobind@latest' "$PATCH_DIR/cmd/gomobile/init.go"
          (cd "$PATCH_DIR" && go build -o "$(go env GOPATH)/bin/gomobile" ./cmd/gomobile)
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          gomobile init

      - name: Ensure local DNSTT AAR is a direct dependency
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("anu_tunnel/app/build.gradle")
          s = p.read_text()
          s = s.replace("implementation fileTree(dir: 'libs', include: ['*.aar'])", "implementation files('libs/dnstt.aar')")
          if "implementation files('libs/dnstt.aar')" not in s:
              raise SystemExit("Could not configure DNSTT AAR dependency")
          p.write_text(s)
          print("Configured explicit local DNSTT AAR dependency")
          PY

      - name: Patch DNSTT binding package usage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("anu_tunnel/app/src/main/java/com/anutunnel/app/AnuVpnService.kt")
          s = p.read_text()
          old = """            dnstt = Dnsttbridge.newClient(dnsEndpoint, domain, key, "127.0.0.1:7000")
                      dnstt!!.start()
                      ensureNotStopping()
                      check(dnstt!!.isRunning) { "DNSTT native client did not start" }"""
          new = """            val client = Dnsttbridge.newClient(dnsEndpoint, domain, key, "127.0.0.1:7000")
                      dnstt = client
                      client.start()
                      ensureNotStopping()
                      check(client.isRunning) { "DNSTT native client did not start" }"""
          if old not in s:
              raise SystemExit("DNSTT client initialization block not found; refusing unsafe patch")
          p.write_text(s.replace(old, new, 1))
          print("DNSTT client initialization patched")
          PY

      - name: Build DNSTT Android AAR
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/anu-native"
          mkdir -p "$WORK"
          git clone --depth 1 https://github.com/dnstt-xyz/dnstt_xyz_app.git "$WORK/dnstt_xyz_app"
          cd "$WORK/dnstt_xyz_app/go_src"
          mkdir -p dnsttbridge
          cp "$GITHUB_WORKSPACE/anu_tunnel/tools/native/dnsttbridge/bridge.go" dnsttbridge/bridge.go
          gofmt -w dnsttbridge/bridge.go
          mkdir -p "$GITHUB_WORKSPACE/anu_tunnel/app/libs"
          gomobile bind -v -androidapi 24 -javapkg=go -target=android/arm64 -o "$GITHUB_WORKSPACE/anu_tunnel/app/libs/dnstt.aar" ./dnsttbridge
          test -s "$GITHUB_WORKSPACE/anu_tunnel/app/libs/dnstt.aar"

      - name: Inspect generated DNSTT Java bindings
        shell: bash
        run: |
          set -Eeuo pipefail
          AAR="$GITHUB_WORKSPACE/anu_tunnel/app/libs/dnstt.aar"
          test -s "$AAR"
          unzip -p "$AAR" classes.jar > "$RUNNER_TEMP/dnstt-classes.jar"
          echo "Generated DNSTT classes:"
          jar tf "$RUNNER_TEMP/dnstt-classes.jar" | sort | tee "$RUNNER_TEMP/dnstt-classes.txt"
          echo "Generated package declarations:"
          unzip -l "$AAR"
      - name: Build Hev ARM64 JNI library
        shell: bash
        run: |
          set -Eeuo pipefail
          WORK="$RUNNER_TEMP/anu-native"
          git clone --depth 1 --recursive https://github.com/heiher/hev-socks5-tunnel.git "$WORK/hev-socks5-tunnel"
          cp "$GITHUB_WORKSPACE/anu_tunnel/Application.mk" "$WORK/hev-socks5-tunnel/Application.mk"
          "$ANDROID_NDK_HOME/ndk-build" NDK_PROJECT_PATH="$WORK/hev-socks5-tunnel" APP_BUILD_SCRIPT="$WORK/hev-socks5-tunnel/Android.mk" APP_ABI=arm64-v8a APP_PLATFORM=android-24 NDK_LIBS_OUT="$GITHUB_WORKSPACE/anu_tunnel/app/src/main/jniLibs" NDK_OUT="$WORK/hev-obj"
          test -s "$GITHUB_WORKSPACE/anu_tunnel/app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so"
      - name: Build BadVPN ARM64 tun2socks and UDPGW JNI engine
        shell: bash
        run: |
          set -Eeuo pipefail
          cmake --version
          bash anu_tunnel/tools/build_badvpn_android.sh
          test -s anu_tunnel/app/src/main/jniLibs/arm64-v8a/libanutunnel-badvpn.so

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: anu_tunnel

      - name: Verify and package outputs
        shell: bash
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          test -s app/libs/dnstt.aar
          test -s app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so
          test -s app/src/main/jniLibs/arm64-v8a/libanutunnel-badvpn.so
          mkdir -p release
          cp "$APK" release/Anu_TUNNEL-debug.apk
          cp app/libs/dnstt.aar release/
          cp app/src/main/jniLibs/arm64-v8a/libhev-socks5-tunnel.so release/
          cp app/src/main/jniLibs/arm64-v8a/libanutunnel-badvpn.so release/
          sha256sum release/* | tee release/SHA256SUMS.txt
        working-directory: anu_tunnel

      - name: Upload APK and native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Anu-TUNNEL-Android-ARM64-v1.6.0
          path: anu_tunnel/release/*
          if-no-files-found: error
          retention-days: 14
